<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer orange/amber crescent glow gradient -->
    <radialGradient id="zipGlow" cx="80%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#ff8400" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0b172a" stop-opacity="0" />
    </radialGradient>
    
    <!-- Base dark circular gradient -->
    <radialGradient id="zipBase" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#14243b" />
      <stop offset="60%" stop-color="#091424" />
      <stop offset="100%" stop-color="#040a14" />
    </radialGradient>

    <!-- Outer subtle rim glow -->
    <linearGradient id="zipRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer ambient glow ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#zipRim)" stroke-width="1.5" opacity="0.65" />
  
  <!-- Main dark navy circular badge -->
  <circle cx="50" cy="50" r="45" fill="url(#zipBase)" />
  
  <!-- Right orange flare glow -->
  <circle cx="50" cy="50" r="45" fill="url(#zipGlow)" />
  
  <!-- Precision sharp lightning bolt -->
  <path d="M 52 20 
           L 32 50 
           L 48 50 
           L 44 80 
           L 68 45 
           L 52 45 Z" 
        fill="#ffffff" 
        filter="url(#subtleGlow)" />
</svg>
